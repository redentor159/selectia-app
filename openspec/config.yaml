# openspec/config.yaml
schema: spec-driven

context: |
  Proyecto: selectia (selector de Inteligencias Artificiales — dashboard de comparación y análisis)
  Stack: Next.js 16 (App Router) + React 19 + TypeScript 5 (strict) + Tailwind CSS 4 + shadcn/ui
  Datos: Prisma 6 (PostgreSQL); gráficas con Recharts; auth con NextAuth 4; i18n con next-intl
  Runtime: Bun (bun.lock); alias de imports @/* -> ./src/*
  Testing: sin runner de tests configurado (strict_tdd: false)
  Idioma de artefactos: español neutro (regla del usuario)

rules:
  proposal:
    - Incluir plan de reversión para cambios riesgosos
  specs:
    - Usar Given/When/Then en los escenarios
    - Usar palabras clave RFC 2119 (MUST, SHALL, SHOULD, MAY)
  design:
    - Incluir diagramas de secuencia para flujos complejos
    - Documentar decisiones de arquitectura con su justificación
  tasks:
    - Agrupar por fase con numeración jerárquica
    - Mantener tareas completables en una sesión
  apply:
    guidelines:
      - Seguir los patrones de código existentes
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Avisar antes de fusionar deltas destructivos
